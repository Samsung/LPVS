name: Check Java Format

on: [ push, pull_request ]

permissions:
  contents: read

jobs:

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Code style analysis
        run: |
          wget -q https://github.com/google/google-java-format/releases/download/v1.20.0/google-java-format-1.20.0-all-deps.jar
          echo "cc57a88cf2e018c0d724e7257af3132e7748fe01a4bc19fd3c7e83a32c848780  google-java-format-1.20.0-all-deps.jar" | sha256sum --check --status
          java -jar google-java-format-1.20.0-all-deps.jar --aosp --skip-javadoc-formatting --skip-reflowing-long-strings --skip-sorting-imports --replace -i $(git ls-files|grep \.java$)
      - name: Print diffs
        run: git --no-pager diff --exit-code
