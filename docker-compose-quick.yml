version: '3.4'

services:

  lpvs:
    build:
      context: .
    image: ghcr.io/samsung/lpvs:latest
    restart: always
    ports:
      - "7896:7896"
    environment:
      ## Database Configuration
      - spring.datasource.url=jdbc:mysql://mysqldb:3306/lpvs
      - spring.datasource.username=${MYSQL_USER:?Set MYSQL_USER in .env (see .env.example)}
      - spring.datasource.password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (see .env.example)}
      - spring.jpa.properties.hibernate.default_schema=lpvs
      ## Github data for fetching code
      - github.login=
      - github.token=
      - github.api.url=https://api.github.com
      - github.secret=${LPVS_GITHUB_SECRET:?Set LPVS_GITHUB_SECRET in .env (see .env.example)}

    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - lpvs

  mysqldb:
    image: mysql:8.4
    restart: always
    # Not published to the host: MySQL is reachable only from other containers on the
    # `lpvs` network. If you need host access for debugging, bind it to localhost only,
    # e.g. `ports: ["127.0.0.1:3306:3306"]`.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: lpvs
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env (see .env.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (see .env.example)}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - ./src/main/resources/database_dump.sql:/docker-entrypoint-initdb.d/init.sql # init for creating db lpvs with predifined tables
    networks:
      - lpvs

  ngrok:
    image: wernight/ngrok
    command: ngrok http lpvs:7896
    ## NGROK Auth token
    environment:
      - NGROK_AUTHTOKEN=
    ports:
      - "4040:4040"
    depends_on:
      - lpvs
    networks:
      - lpvs

networks:
  lpvs:
